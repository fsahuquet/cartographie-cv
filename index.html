<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographie — Manifestations d'août 2025</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <a href="carte.png" target="_blank">
        <img src="carte.png" alt="Manifestations d’août 2025 : un conflit social urbain à toutes les échelles">
    </a>
</body>
</html>
